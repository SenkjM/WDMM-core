[package]
name        = "wdmm-ffi"
description  = "C ABI surface for flutter_rust_bridge (Android) and csbindgen (Windows)"
version      = { workspace = true }
edition      = { workspace = true }
publish      = { workspace = true }

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Forward to wdmm-ffmpeg: enable real FFmpeg linking (Android/desktop builds).
# Without this flag, wdmm-ffmpeg provides stubs and links no libav* symbols.
ffmpeg = ["wdmm-ffmpeg/ffmpeg"]

[dependencies]
wdmm-core    = { workspace = true }
wdmm-crypto  = { workspace = true }
wdmm-drivers = { workspace = true }
wdmm-dlna    = { workspace = true }
wdmm-proxy   = { workspace = true }
wdmm-ffmpeg  = { workspace = true }
wdmm-openapi = { workspace = true }
wdmm-queue   = { workspace = true }
wdmm-storage = { workspace = true }
wdmm-sync    = { workspace = true }
wdmm-text    = { workspace = true }
tokio        = { workspace = true }
serde_json   = { workspace = true }
uuid         = { workspace = true }
base64       = { workspace = true }
chrono       = { workspace = true }
futures      = { workspace = true }
bytes        = { workspace = true }
zip          = { workspace = true }
lofty        = { workspace = true }

[dev-dependencies]
reqwest     = { workspace = true }
rusqlite    = { workspace = true }
async-trait = { workspace = true }
