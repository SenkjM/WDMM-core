[package]
name        = "wdmm-ffmpeg"
description = "Vendored FFmpeg bindings — probe, HLS transcode jobs, segment management"
version     = { workspace = true }
edition     = { workspace = true }
publish     = { workspace = true }

[dependencies]
thiserror    = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
rand         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
wdmm-core    = { workspace = true }

[build-dependencies]
# link logic is in build.rs (dynamic link against libav* shared libs).

[features]
# Enable real FFmpeg linking. Without this flag, all public APIs return
# `FfmpegError::Unavailable` and no link-time FFmpeg symbols are required
# (used for CI builds on platforms without FFmpeg, e.g. Windows CI runner).
ffmpeg = []
